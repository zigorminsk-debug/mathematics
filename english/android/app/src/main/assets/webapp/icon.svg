<!-- icon.svg — знак английского тренажёра: речевое облако с «EN».

     Геометрия та же, что у генератора растра (english/tools/make_icon.py):
     квадрат 192 × 192 со скруглением 42, облако (36, 44)–(156, 130) с радиусом
     26, хвостик (66,128) (98,128) (70,158), буквы — стойка «E» x=46 шириной 10,
     верхний и средний штрихи 44 и 34, буква «N» стойками x=100 и x=134 шириной
     10 и диагональю 105→139. Палитра: #3DC9A6 → #116E7A, буквы #0E6B60. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" role="img" aria-label="EN">
  <defs>
    <linearGradient id="en-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3DC9A6"/>
      <stop offset="1" stop-color="#116E7A"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#en-bg)"/>
  <rect x="36" y="44" width="120" height="86" rx="26" fill="#FFFFFF"/>
  <polygon points="66,128 98,128 70,158" fill="#FFFFFF"/>
  <g fill="#0E6B60">
    <rect x="46" y="68" width="10" height="48"/>
    <rect x="46" y="68" width="44" height="10"/>
    <rect x="46" y="87" width="34" height="10"/>
    <rect x="46" y="106" width="44" height="10"/>
    <rect x="100" y="68" width="10" height="48"/>
    <rect x="134" y="68" width="10" height="48"/>
    <path d="M105,68 L139,116" stroke="#0E6B60" stroke-width="10" fill="none"/>
  </g>
</svg>
