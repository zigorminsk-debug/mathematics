# Permanent release key of «Репетитор ЦТ: Русский язык» (by.ziv.ctrussian).
# Android installs an update over an existing app only when both APKs carry the
# SAME certificate, so this key must never change once a release is published.
# It is a separate key: the mathematics tutor keeps its own key in its branch.
#
# Like the mathematics tutor, the key is committed (GitHub-release sideload
# distribution; Actions secrets are not writable from the build session). CI may
# override every value through environment variables / secrets (see docs/RELEASE.md).
storeFile=ctrussian-release.p12
storePassword=ctrussian2026
keyAlias=ctrussian
keyPassword=ctrussian2026
storeType=PKCS12
