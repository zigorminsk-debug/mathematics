# Constant release key of the project — this is what makes in-place updates work:
# Android only installs an APK over an existing one when both are signed with the
# SAME certificate, so this key must never change and must be reused by CI.
#
# For a public release you should replace this demo key with your own private one
# (see docs/RELEASE.md) and keep the passwords in GitHub secrets.
storeFile=ctmaths-release.p12
storePassword=ctmaths2026
keyAlias=ctmaths
keyPassword=ctmaths2026
storeType=PKCS12
