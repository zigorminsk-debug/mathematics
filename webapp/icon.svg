<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="CT physics tutor">
  <!-- Иконка физики: атом (ядро + три орбиты). Тот же рисунок рисует
       tools/make_icon.py в webapp/icon.png и Android-векторы
       android/app/src/main/res/drawable/ic_launcher_{background,foreground}.xml. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a7ce8"/><stop offset="1" stop-color="#213f9c"/>
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#g)"/>
  <g stroke="#ffffff" stroke-width="6.5" fill="none">
    <ellipse cx="96" cy="96" rx="56" ry="21"/>
    <ellipse cx="96" cy="96" rx="56" ry="21" transform="rotate(60 96 96)"/>
    <ellipse cx="96" cy="96" rx="56" ry="21" transform="rotate(-60 96 96)"/>
  </g>
  <circle cx="96" cy="96" r="11.5" fill="#ffd166"/>
</svg>
