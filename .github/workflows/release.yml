name: Release (Android APK + Windows EXE + content feed)

# Публикация релиза: подписанный APK, EXE для Windows и обновляемый набор
# заданий. Приложение само скачивает version.json из releases/latest/download,
# поэтому новая база заданий устанавливается «поверх» без потери прогресса.
#
# Запуск: вручную (Actions → Release → Run workflow) или тегом v*.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v2026.10.2)'
        required: true
        default: 'v2026.10.2'
      release_name:
        description: 'Release name'
        required: false
        default: 'CT Maths Tutor'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reproducible build stamp (commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build and verify the content bank
        run: |
          python3 tools/build_content.py
          python3 tools/sync_assets.py

      - name: Resolve the release tag and versions
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          CONTENT_VERSION=$(cat VERSION)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "content=$CONTENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=${{ github.event.inputs.release_name || 'CT Maths Tutor' }}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (content $CONTENT_VERSION, versionCode ${{ github.run_number }})"

      - name: The permanent signing key still matches the committed fingerprint
        run: python3 tools/check_signature.py --keystore android/keystore/ctmaths-release.p12

      - name: Android — unit tests, debug and signed release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon assembleDebug assembleRelease

      - name: Windows — tests and both architectures
        working-directory: windows
        run: |
          go test ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.buildStamp=${{ github.run_number }}" \
            -o ../dist/CTMathsTutor-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -H=windowsgui -X main.buildStamp=${{ github.run_number }}" \
            -o ../dist/CTMathsTutor-arm64.exe .

      - name: Verify the release APK is signed with the permanent key
        working-directory: android
        run: |
          python3 ../tools/check_signature.py \
            --apk app/build/outputs/apk/release/app-release.apk \
            --tool "$ANDROID_HOME/build-tools/34.0.0/apksigner"

      - name: Collect the artefacts and the update manifest
        run: |
          mkdir -p release
          cp dist/content/*.json release/
          cp dist/CTMathsTutor-amd64.exe release/
          cp dist/CTMathsTutor-arm64.exe release/
          cp android/app/build/outputs/apk/release/*.apk release/ 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/*.apk release/ 2>/dev/null || true
          python3 - <<'PY'
          import hashlib, json, pathlib, datetime
          out = pathlib.Path('release')
          version = json.loads((out / 'version.json').read_text(encoding='utf-8'))
          files = {}
          for path in sorted(out.glob('*.json')):
              if path.name == 'version.json':
                  continue
              body = path.read_bytes()
              files[path.name] = {'sha256': hashlib.sha256(body).hexdigest(), 'bytes': len(body)}
          version['files'] = files
          version['baseUrl'] = 'https://github.com/${{ github.repository }}/releases/latest/download'
          version['released'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          (out / 'version.json').write_text(json.dumps(version, ensure_ascii=False, indent=1), encoding='utf-8')
          print('manifest files:', ', '.join(files))
          PY

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.tag }}
          make_latest: true
          body: |
            ## Репетитор по математике для ЦТ (РБ) / CT maths tutor

            **Разработчик / Developer:** Zakharevich Igor — ziv@csl.by — +3753371412

            ### Что внутри
            * `CTMathsTutor-amd64.exe`, `CTMathsTutor-arm64.exe` — Windows (Go + HTML GUI),
              одинаковая подпись сборки и постоянный ключ обновлений.
            * `app-release.apk` — Android, подписан **постоянным ключом проекта**:
              новый APK устанавливается поверх старого без удаления и без потери статистики.
            * `content/*.json` — база заданий (5 вариантов ЦТ 2021–2025 + генератор
              однотипных заданий) и манифест `version.json` со SHA-256.
              Приложения загружают её из `releases/latest/download` и обновляются «поверх».

            ### Языки
            Русский и English — переключение языка прямо в интерфейсе,
            решения заданий доступны двуязычно.

            Итог проверки заданий: точная арифметика по каждому ответу (см. лог сборки).
          files: release/*
          fail_on_unmatched_files: false
