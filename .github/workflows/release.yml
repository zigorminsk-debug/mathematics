name: Release

# Recovery/manual and explicit-tag entry points use the SAME complete CI gates
# and SAME artifacts as automatic branch publication; no unverified rebuilds.
on:
  push:
    tags: ['physics-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact tag; leave empty for automatic increasing version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

# Тот же outer lock, что у доверенного branch CI этой ветки (физика). Ключ
# отличается от математического, поэтому предметные очереди не блокируют друг
# друга. Reusable CI вызывается с release_request=true и берёт свой inner group.
concurrency:
  group: ctphysics-release-pipeline
  queue: max
  cancel-in-progress: false

jobs:
  build_verify_publish:
    name: Build, verify and release
    if: ${{ github.repository == 'zigorminsk-debug/mathematics' && (github.ref_type == 'branch' || startsWith(github.ref, 'refs/tags/physics-v')) }}
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      release_request: true
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
