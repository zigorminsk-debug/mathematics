name: Release

# Subject «russian»: recovery/manual and explicit russian-v… tag entry points use the SAME complete CI gates
# and SAME artifacts as automatic branch publication; no unverified rebuilds.
on:
  push:
    tags: ['russian-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact tag; leave empty for automatic increasing version'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  actions: read

# This is the same outer lock as trusted branch CI of THIS subject (never the
# mathematics lock). The reusable CI caller receives release_request=true so it
# uses a different inner group (no deadlock).
concurrency:
  group: ctrussian-release-pipeline
  queue: max
  cancel-in-progress: false

jobs:
  build_verify_publish:
    name: Build, verify and release
    if: ${{ github.repository == 'zigorminsk-debug/mathematics' && (github.ref_type == 'branch' || startsWith(github.ref, 'refs/tags/russian-v')) }}
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
      release_request: true
      tag: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
